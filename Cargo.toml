[package]
name = "csv-bench"
version = "0.8.0"
edition = "2021"
rust-version = "1.74"
description = "Desktop CSV/Parquet/XLS graphing workbench (egui)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unipsycho/csv-bench"
authors = ["Agile Automation / Mike King <mike@agileautomation.ca>"]
publish = false

[dependencies]
# Pinned for gitlab.com/rust-lang/crates.io-index (stale ~2024). On M17 you may
# bump to 0.29 and drop .cargo/config.toml to use live crates.io.
eframe = { version = "=0.29.0", default-features = true }
egui = "=0.29.0"
egui_plot = "=0.29.0"
egui_extras = { version = "=0.29.0", features = ["image"] }

csv = "=1.3.0"
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
toml = "=0.8.23"
chrono = { version = "=0.4.34", default-features = false, features = ["std", "clock"] }
rfd = "=0.13.0"
notify = "=6.1.1"
thiserror = "=1.0.69"
anyhow = "=1.0.80"
uuid = { version = "=1.7.0", features = ["v4", "serde"] }
parking_lot = "=0.12.1"
calamine = "=0.24.0"
# Lightweight Parquet (no Arrow). Codecs: UNCOMPRESSED + SNAPPY only.
parquet = { version = "=53.0.0", default-features = false, features = ["snap"] }
# Match eframe/egui-winit; used to force X11 so OS file drops work (winit Wayland has no DroppedFile).
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11"] }

[profile.release]
lto = true
codegen-units = 1
