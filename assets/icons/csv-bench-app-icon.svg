<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2a32"/>
      <stop offset="100%" stop-color="#0f1a20"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0a040"/>
      <stop offset="100%" stop-color="#e85d2a"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e87830" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e87830" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <!-- Rounded app tile -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48" fill="url(#bg)"/>
  <!-- Soft inner frame -->
  <rect x="20" y="20" width="216" height="216" rx="40" ry="40" fill="none" stroke="#2e4a52" stroke-width="3"/>
  <!-- Plot area baseline + faint grid -->
  <g stroke="#3a5a62" stroke-width="2" opacity="0.55">
    <line x1="52" y1="188" x2="204" y2="188"/>
    <line x1="52" y1="148" x2="204" y2="148"/>
    <line x1="52" y1="108" x2="204" y2="108"/>
    <line x1="52" y1="68" x2="204" y2="68"/>
  </g>
  <!-- Y axis tick mark -->
  <line x1="52" y1="56" x2="52" y2="188" stroke="#6a9aa4" stroke-width="3" stroke-linecap="round"/>
  <!-- Area under curve -->
  <path d="M52,168 L84,142 L116,158 L148,96 L180,118 L204,72 L204,188 L52,188 Z" fill="url(#fill)"/>
  <!-- Main chart polyline -->
  <path d="M52,168 L84,142 L116,158 L148,96 L180,118 L204,72"
        fill="none" stroke="url(#line)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Accent peak dot -->
  <circle cx="148" cy="96" r="10" fill="#fff3e0"/>
  <circle cx="148" cy="96" r="5.5" fill="#e85d2a"/>
</svg>
